app:
  name: darvin-cowork
  env: development

database:
  # Empty (default) puts the sessions.db in the same user-level directory
  # as config.yaml, aligned with the Electron main process's SessionStore:
  #   Windows %APPDATA%\darvin-cowork\darvin-agent\sessions.db
  #   macOS   ~/Library/Application Support/darvin-cowork/darvin-agent/sessions.db
  #   Linux   ~/.config/darvin-cowork/darvin-agent/sessions.db
  # The Electron main process also injects DARVIN_SESSIONS_DSN (absolute
  # path) into the agent's environment so the path is owned by the
  # launcher even if this value is left empty. An absolute path here wins
  # over the env var, and a relative path is resolved against the
  # process cwd (handy for `go run`/test fixtures).
  sessions_dsn: ""

log:
  level: info
  encoding: console
  # stderr keeps stdout clean for the Gateway `<port>NNNNN</port>` line.
  output: stderr
  filename: ./logs/app.log
  max_size: 100
  max_backups: 7
  max_age: 30

llm:
  provider: anthropic
  # Empty by default — the user's real key is supplied by either the
  # Settings UI (writes to UserConfigDir/darvin-cowork/config.yaml)
  # or the LLM_API_KEY env var (viper.AutomaticEnv binds it).
  api_key: ""
  base_url: ""

agent:
  max_turns: 25
  tool_timeout_ms: 30000
  workdir: "."
  shell_allowlist:
    - ls
    - cat
    - pwd
    - echo
    - grep
    - head
    - tail
    - wc
    - find
    - tree
    - git
    - go
    - npm
    - node
    - python
    - python3
    - mkdir
    - cp
    - mv
    - touch
    - rm
    - rmdir
    - chmod
    - curl
    - jq
    - sed
    - awk
    - tar
    - unzip
    - date
  event_buffer: 64
  provider_name: anthropic
  model: claude-sonnet-4-5
  instructions: ""

  # ContextEngine (ctxengine) — see specs/features/agent-context-engine §FR-12.
  # Defaults match ctxengine.NewDefaultAssembler's zero-value behaviour
  # except AssemblerEnabled, which is true at the YAML front-end so end
  # users get the assembler pipeline without flipping a flag.
  token_budget: 0            # 0 = no budget check (executor fallback)
  compact_tail_keep: 6       # messages preserved verbatim by Compact
  tool_result_max_bytes: 0   # 0 = no truncation of oversized tool output
  compact_max_retries: 0     # summariser retry budget on Compact failure
  summarize_max_tokens: 1024 # cap for the summarise LLM call
  system_prompt_addition: "" # extra block appended to the system prompt
  assembler_enabled: true    # false = executor takes session.Messages() fallback
